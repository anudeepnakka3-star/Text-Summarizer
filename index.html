<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>

    <style>
        /* ---------- Global ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b0f;
            --card: rgba(28, 28, 34, 0.72);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f5f5f7;
            --muted: #98989f;
            --accent: #0a84ff;
            --accent-hover: #339cff;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", "Helvetica Neue", Arial, sans-serif;

            color: var(--text);
            background:
                radial-gradient(circle at 15% 15%, rgba(10, 132, 255, 0.16), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(94, 92, 230, 0.13), transparent 30%),
                var(--bg);
        }

        /* ---------- Main Card ---------- */
        .container {
            width: 100%;
            max-width: 780px;
            padding: 48px;

            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            animation: fadeUp 0.7s ease both;
        }

        /* ---------- Header ---------- */
        h1 {
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 700;
            letter-spacing: -0.055em;
            line-height: 1.1;
            margin-bottom: 12px;

            background: linear-gradient(135deg, #ffffff 20%, #a9cfff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container > h3 {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: #8abfff;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-bottom: 18px;
        }

        .container > h3::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #30d158;
            box-shadow: 0 0 12px rgba(48, 209, 88, 0.7);
        }

        .container > p {
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* ---------- Form ---------- */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        textarea {
            width: 100%;
            min-height: 230px;
            resize: vertical;

            padding: 20px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);

            background: rgba(0, 0, 0, 0.22);
            color: var(--text);

            font-family: inherit;
            font-size: 1rem;
            line-height: 1.65;

            outline: none;
            transition: border-color 0.25s ease,
                        background 0.25s ease,
                        box-shadow 0.25s ease;
        }

        textarea::placeholder {
            color: #62626a;
        }

        textarea:focus {
            border-color: rgba(10, 132, 255, 0.75);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.1);
        }

        /* ---------- Button ---------- */
        button {
            align-self: flex-end;

            border: none;
            border-radius: 980px;
            padding: 13px 25px;

            background: var(--accent);
            color: white;

            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;

            cursor: pointer;
            transition: transform 0.2s ease,
                        background 0.2s ease,
                        box-shadow 0.2s ease;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(10, 132, 255, 0.25);
        }

        button:active {
            transform: scale(0.97);
        }

        /* ---------- Summary Output ---------- */
        .summary-output {
            margin-top: 36px;
            padding: 26px;

            min-height: 150px;

            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);

            animation: fadeIn 0.5s ease both;
        }

        #summary-heading {
            display: flex;
            align-items: center;
            gap: 10px;

            color: #f5f5f7;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        #summary-heading::before {
            content: "✦";
            display: grid;
            place-items: center;

            width: 28px;
            height: 28px;
            border-radius: 9px;

            background: rgba(10, 132, 255, 0.15);
            color: #64b5ff;
            font-size: 0.9rem;
        }

        #summary-text {
            color: #b8b8c0;
            font-size: 0.98rem;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        /* ---------- Animations ---------- */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 600px) {
            body {
                padding: 14px;
                align-items: flex-start;
                padding-top: 30px;
            }

            .container {
                padding: 28px 20px;
                border-radius: 22px;
            }

            h1 {
                font-size: 2.3rem;
            }

            textarea {
                min-height: 200px;
            }

            button {
                width: 100%;
            }

            .summary-output {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>Using Hugging Face Transformers</h3>
        <p>Write or Paste your content below for quick summarization</p>

        <form id="summarization-form">
            <textarea
                id="dialogue-input"
                placeholder="Enter your content here..."
                required
            ></textarea>

            <button type="submit">Summarize&nbsp; →</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>
    <script>
         document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
